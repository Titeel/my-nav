<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚合导航 - 权限隔离版</title>
    <style>
        :root { --primary-color: #007bff; --danger-color: #ff4d4f; --success-color: #28a745; --bg-gray: #f4f7f9; }
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg-gray); min-height: 100vh; display: flex; }
        
        #content-wrapper { flex: 1; padding: 40px; transition: margin-right 0.3s ease; }
        body.admin-open #content-wrapper { margin-right: 340px; }
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, 340px); gap: 25px; justify-content: center; }
        
        .blogger-card { width: 340px; background: #fff; border-radius: 16px; border: 1px solid #eee; padding: 20px; position: relative; box-sizing: border-box; }
        .edit-mode-active { border: 2px solid var(--primary-color); background: #fafafa; }
        .name-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .blogger-name-input { border: none; font-size: 18px; font-weight: bold; outline: none; background: transparent; width: 100%; }
        
        .link-group { display: flex; flex-direction: column; gap: 10px; }
        .link-item-vertical { display: flex; flex-direction: column; padding: 10px 15px; background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .link-item-vertical:hover { border-color: var(--primary-color); background: #fdfdfd; }
        .link-label-text { font-size: 13px; font-weight: bold; color: #333; }
        .link-url-text { font-size: 11px; color: #999; }
        
        /* 管理员特有标签样式 */
        .admin-tag-badge { font-size: 10px; background: #fff1f0; color: #ff4d4f; padding: 2px 6px; border-radius: 4px; margin-left: 5px; border: 1px solid #ffa39e; }

        /* 编辑状态 */
        .edit-unit { position: relative; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .tag-name-input { border: none; font-weight: bold; width: 80%; outline: none; font-size: 13px; border-bottom: 1px dashed #eee; }
        .url-input { border: none; width: 100%; font-size: 11px; color: #888; outline: none; margin-top: 5px; }
        .admin-toggle { font-size: 11px; color: #666; margin-top: 5px; cursor: pointer; display: flex; align-items: center; }

        #side-admin-panel { position: fixed; top: 0; right: -340px; width: 340px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        body.admin-open #side-admin-panel { right: 0; }
        .btn-trigger { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; border: none; padding: 12px 20px; border-radius: 30px; cursor: pointer; z-index: 999; }
        
        .input-style { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        /* 弹窗 */
        #pwd-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
        #pwd-box { background: #fff; padding: 30px; border-radius: 16px; width: 300px; text-align: center; }

        /* 日志面板 */
        #log-panel { display: none; margin-top: 20px; background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 11px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="main-grid"></div>
    </div>

    <div id="side-admin-panel">
        <h2 id="panel-title" style="margin-top:0; cursor: pointer;" onclick="handleTitleClick()">管理中心</h2>
        <div id="unlock-features" style="display: none; margin-bottom: 15px;">
            <button class="btn-action" style="background:#444; color:white; font-size: 12px;" onclick="toggleLogs()">查看/隐藏 IP 访问记录</button>
            <div id="log-panel"></div>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin:15px 0">
        <div style="font-size:13px; color:#666; margin-bottom:8px;">新增卡片</div>
        <input type="text" id="newName" class="input-style" placeholder="名称">
        <textarea id="newUrls" class="input-style" placeholder="批量链接(每行一个)" style="height:100px; resize:none;"></textarea>
        <button class="btn-action" style="background:var(--primary-color); color:white;" onclick="addBlogger()">确认创建</button>
        <button class="btn-action" style="background:#eee;" onclick="toggleAdmin(false)">退出编辑</button>
    </div>

    <div id="pwd-overlay">
        <div id="pwd-box">
            <h3 id="pwd-head">身份验证</h3>
            <input type="password" id="adminPwd" class="input-style" placeholder="请输入密码">
            <div style="display:flex; gap:10px">
                <button class="btn-action" style="background:var(--primary-color); color:white" onclick="doPwdAction()">确定</button>
                <button class="btn-action" style="background:#eee" onclick="closePwd()">取消</button>
            </div>
        </div>
    </div>

    <button class="btn-trigger" onclick="toggleAdmin(true)">⚙️ 开启管理模式</button>

<script>
    let bloggers = JSON.parse(localStorage.getItem('verticalData')) || [];
    let accessLogs = JSON.parse(localStorage.getItem('accessLogs')) || [];
    let isAdminMode = false;
    let isUnlocked = false; 
    let currentIP = "127.0.0.1";
    let pwdTask = "unlock"; // unlock or change

    // 初始化获取IP
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => currentIP = d.ip);

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = bloggers.map((b, i) => {
            // 权限过滤：如果未解锁，过滤掉标记为 isAdmin 的链接
            const visibleLinks = isUnlocked ? b.links : b.links.filter(l => !l.isAdmin);
            
            return `
            <div class="blogger-card ${isAdminMode ? 'edit-mode-active' : ''}">
                <div class="name-row">
                    <input type="text" class="blogger-name-input" value="${b.name}" ${!isAdminMode ? 'readonly' : ''} onchange="bloggers[${i}].name=this.value; save()">
                </div>
                <div class="link-group">
                    ${visibleLinks.map((link, j) => renderItem(link, i, j)).join('')}
                </div>
                ${isAdminMode ? `
                    <button class="add-item-btn" onclick="addLinkLine(${i})">+ 添加新链接</button>
                    <div style="margin-top:10px; display:flex; gap:5px">
                        <button class="btn-action" style="background:var(--success-color); color:white; font-size:12px;" onclick="saveCard(${i})">保存卡片</button>
                        <button class="btn-action" style="background:#ddd; font-size:12px;" onclick="removeCard(${i})">删除</button>
                    </div>
                    <div id="fb-${i}" style="font-size:11px; color:green; text-align:center"></div>
                ` : ''}
            </div>`;
        }).join('');
    }

    function renderItem(link, cardIdx, linkIdx) {
        if (!isAdminMode) {
            return `
            <a href="${link.url}" target="_blank" class="link-item-vertical" onclick="recordLog('${link.label}')">
                <span class="link-label-text">${link.label} ${link.isAdmin ? '<span class="admin-tag-badge">密</span>' : ''}</span>
                <span class="link-url-text">${link.url}</span>
            </a>`;
        }
        // 编辑模式下显示“设为管理员可见”勾选框
        return `
        <div class="edit-unit">
            <input type="text" class="tag-name-input" value="${link.label}">
            <input type="text" class="url-input" value="${link.url}">
            <label class="admin-toggle">
                <input type="checkbox" ${link.isAdmin ? 'checked' : ''} onchange="updateLinkPrivilege(${cardIdx}, ${linkIdx}, this.checked)"> 
                仅管理员可见
            </label>
            <span style="position:absolute; top:5px; right:10px; cursor:pointer" onclick="this.parentElement.remove()">×</span>
        </div>`;
    }

    // IP 记录功能
    function recordLog(label) {
        const entry = { label, ip: currentIP, time: new Date().toLocaleString() };
        accessLogs.unshift(entry);
        if(accessLogs.length > 100) accessLogs.pop();
        localStorage.setItem('accessLogs', JSON.stringify(accessLogs));
    }

    function toggleLogs() {
        const panel = document.getElementById('log-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        panel.innerHTML = accessLogs.map(l => `<div>[${l.time}] ${l.ip} 访问: ${l.label}</div>`).join('') || "暂无记录";
    }

    // 隐藏触发逻辑
    function handleTitleClick() {
        if (!isUnlocked) {
            pwdTask = "unlock";
            document.getElementById('pwd-head').innerText = "验证隐藏特权";
            document.getElementById('pwd-overlay').style.display = 'flex';
        } else {
            pwdTask = "change";
            document.getElementById('pwd-head').innerText = "修改管理密码";
            document.getElementById('pwd-overlay').style.display = 'flex';
        }
    }

    function doPwdAction() {
        const val = document.getElementById('adminPwd').value;
        const saved = localStorage.getItem('adminKey') || "K888";
        
        if (pwdTask === "unlock") {
            if (val === saved) {
                isUnlocked = true;
                document.getElementById('unlock-features').style.display = 'block';
                document.getElementById('panel-title').innerText = "管理中心 (已提权)";
                closePwd();
                render();
            } else { alert("验证失败"); }
        } else {
            if(val) {
                localStorage.setItem('adminKey', val);
                alert("密码修改成功");
                closePwd();
            }
        }
    }

    // 基础功能
    function toggleAdmin(s) { isAdminMode = s; document.body.classList.toggle('admin-open', s); render(); }
    function closePwd() { document.getElementById('pwd-overlay').style.display = 'none'; document.getElementById('adminPwd').value = ''; }
    function save() { localStorage.setItem('verticalData', JSON.stringify(bloggers)); }
    
    function addLinkLine(idx) {
        const group = document.querySelectorAll('.link-group')[idx];
        const div = document.createElement('div');
        div.className = 'edit-unit';
        div.innerHTML = `<input type="text" class="tag-name-input" placeholder="名称"><input type="text" class="url-input" placeholder="网址"><label class="admin-toggle"><input type="checkbox"> 仅管理员可见</label><span style="position:absolute; top:5px; right:10px; cursor:pointer" onclick="this.parentElement.remove()">×</span>`;
        group.appendChild(div);
    }

    function saveCard(idx) {
        const card = document.querySelectorAll('.blogger-card')[idx];
        const name = card.querySelector('.blogger-name-input').value;
        const units = card.querySelectorAll('.edit-unit');
        let links = [];
        units.forEach(u => {
            const label = u.querySelector('.tag-name-input').value;
            const url = u.querySelector('.url-input').value;
            const isAdmin = u.querySelector('input[type="checkbox"]').checked;
            if(url) links.push({ label, url, isAdmin });
        });
        bloggers[idx] = { name, links };
        save();
        render();
        document.getElementById(`fb-${idx}`).innerText = "保存成功";
    }

    function addBlogger() {
        const name = document.getElementById('newName').value;
        const lines = document.getElementById('newUrls').value.split('\n').filter(l => l.trim());
        if(!name) return;
        bloggers.push({ name, links: lines.map(url => ({ label: "新链接", url, isAdmin: false })) });
        save(); render();
        document.getElementById('newName').value = ''; document.getElementById('newUrls').value = '';
    }

    function removeCard(i) { if(confirm("确定删除吗？")) { bloggers.splice(i,1); save(); render(); } }
    function updateLinkPrivilege(cI, lI, val) { bloggers[cI].links[lI].isAdmin = val; save(); }

    window.onload = render;
</script>
</body>
</html>
