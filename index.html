<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚合导航 - 权限隔离修正版</title>
    <style>
        :root { --primary-color: #007bff; --danger-color: #ff4d4f; --success-color: #28a745; --bg-gray: #f4f7f9; }
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg-gray); min-height: 100vh; display: flex; transition: background 0.3s; }
        body.unlocked { background: #f0faff; } /* 解锁后背景微调，方便分辨 */

        #content-wrapper { flex: 1; padding: 40px; transition: margin-right 0.3s ease; }
        body.admin-open #content-wrapper { margin-right: 340px; }
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, 340px); gap: 25px; justify-content: center; }
        
        .blogger-card { width: 340px; background: #fff; border-radius: 16px; border: 1px solid #eee; padding: 20px; position: relative; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .edit-mode-active { border: 2px solid var(--primary-color); background: #fafafa; }
        .name-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .blogger-name-input { border: none; font-size: 18px; font-weight: bold; outline: none; background: transparent; width: 100%; }
        
        .link-group { display: flex; flex-direction: column; gap: 10px; }
        .link-item-vertical { display: flex; flex-direction: column; padding: 10px 15px; background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; cursor: pointer; text-decoration: none; transition: 0.2s; position: relative; }
        .link-item-vertical:hover { border-color: var(--primary-color); }
        .link-label-text { font-size: 13px; font-weight: bold; color: #333; }
        .link-url-text { font-size: 11px; color: #999; overflow: hidden; text-overflow: ellipsis; }
        
        /* 隐藏标签的特殊标记 */
        .admin-tag-badge { font-size: 10px; background: #fff1f0; color: #ff4d4f; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffa39e; margin-left: 5px; }

        /* 编辑控件 */
        .edit-unit { position: relative; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .tag-name-input { border: none; font-weight: bold; width: 80%; outline: none; font-size: 13px; border-bottom: 1px dashed #eee; }
        .url-input { border: none; width: 100%; font-size: 11px; color: #888; outline: none; margin-top: 5px; }
        .privilege-label { font-size: 11px; color: #666; margin-top: 8px; display: flex; align-items: center; cursor: pointer; }

        #side-admin-panel { position: fixed; top: 0; right: -340px; width: 340px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        body.admin-open #side-admin-panel { right: 0; }
        .btn-trigger { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; border: none; padding: 12px 20px; border-radius: 30px; cursor: pointer; z-index: 999; font-weight: bold; }
        
        .input-style { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        
        /* 弹窗样式 */
        #pwd-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        #pwd-box { background: #fff; padding: 30px; border-radius: 16px; width: 300px; text-align: center; }

        #log-area { display: none; margin-top: 15px; background: #f5f5f5; padding: 10px; border-radius: 8px; font-size: 11px; max-height: 150px; overflow-y: auto; text-align: left; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="main-grid"></div>
    </div>

    <div id="side-admin-panel">
        <h2 id="panel-title" style="margin-top:0; cursor: pointer;" onclick="triggerPwdDialog()">管理中心</h2>
        
        <div id="unlocked-zone" style="display: none; padding: 10px; background: #f0faff; border-radius: 10px; margin-bottom: 20px;">
            <p style="font-size:12px; color:#007bff; margin:0 0 10px 0;">已解锁：隐藏标签 & IP记录</p>
            <button class="btn-action" style="background:#555; color:white; font-size:12px;" onclick="toggleLogs()">查看 IP 访问日志</button>
            <div id="log-area"></div>
            <button class="btn-action" style="background:var(--danger-color); color:white; font-size:12px; margin-top:10px;" onclick="lockPrivilege()">🔒 退出特权模式（隐藏标签）</button>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin:15px 0">
        
        <div style="font-size:13px; color:#666; margin-bottom:8px;">新增卡片</div>
        <input type="text" id="newName" class="input-style" placeholder="名称">
        <textarea id="newUrls" class="input-style" placeholder="批量网址 (每行一个)" style="height:80px; resize:none;"></textarea>
        <button class="btn-action" style="background:var(--primary-color); color:white;" onclick="addBlogger()">创建新卡片</button>
        <button class="btn-action" style="background:#eee; color:#333;" onclick="toggleAdmin(false)">收起侧边栏</button>
    </div>

    <div id="pwd-overlay">
        <div id="pwd-box">
            <h3 id="pwd-title">权限验证</h3>
            <input type="password" id="adminPwd" class="input-style" placeholder="输入密码">
            <div style="display:flex; gap:10px">
                <button class="btn-action" style="background:var(--primary-color); color:white" onclick="handlePwdSubmit()">确定</button>
                <button class="btn-action" style="background:#eee" onclick="closePwd()">取消</button>
            </div>
        </div>
    </div>

    <button class="btn-trigger" onclick="toggleAdmin(true)">⚙️ 管理 / 编辑</button>

<script>
    // 数据持久化
    let bloggers = JSON.parse(localStorage.getItem('vertical_v3_data')) || [];
    let accessLogs = JSON.parse(localStorage.getItem('vertical_v3_logs')) || [];
    
    // 运行状态（刷新页面即重置）
    let isAdminMode = false;
    let isUnlocked = false; 
    let currentIP = "获取中...";
    let currentTask = "unlock";

    // 初始化：获取访问者IP
    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => currentIP = d.ip);

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = bloggers.map((b, i) => {
            // 核心过滤逻辑：未解锁时，彻底剔除 isAdmin 链接
            const displayLinks = isUnlocked ? b.links : b.links.filter(l => !l.isAdmin);
            
            return `
            <div class="blogger-card ${isAdminMode ? 'edit-mode-active' : ''}">
                <div class="name-row">
                    <input type="text" class="blogger-name-input" value="${b.name}" ${!isAdminMode ? 'readonly' : ''} onchange="updateCardName(${i}, this.value)">
                </div>
                <div class="link-group">
                    ${displayLinks.map((link, j) => renderLinkItem(link, i, j)).join('')}
                </div>
                ${isAdminMode ? `
                    <button class="add-item-btn" onclick="addNewLinkLine(${i})">+ 增加链接</button>
                    <div style="margin-top:15px; display:flex; gap:8px">
                        <button class="btn-action" style="background:var(--success-color); color:white; font-size:12px; flex:1" onclick="saveCard(${i})">保存卡片</button>
                        <button class="btn-action" style="background:#ddd; font-size:12px; flex:0.5" onclick="deleteCard(${i})">删除</button>
                    </div>
                ` : ''}
            </div>`;
        }).join('');
    }

    function renderLinkItem(link, cardI, linkI) {
        if (!isAdminMode) {
            return `
            <a href="${link.url}" target="_blank" class="link-item-vertical" onclick="logAccess('${link.label}')">
                <span class="link-label-text">${link.label} ${link.isAdmin ? '<span class="admin-tag-badge">密</span>' : ''}</span>
                <span class="link-url-text">${link.url}</span>
            </a>`;
        }
        return `
        <div class="edit-unit">
            <span style="position:absolute; right:10px; top:5px; cursor:pointer; color:#ccc" onclick="this.parentElement.remove()">×</span>
            <input type="text" class="tag-name-input" value="${link.label}">
            <input type="text" class="url-input" value="${link.url}">
            <label class="privilege-label">
                <input type="checkbox" ${link.isAdmin ? 'checked' : ''}> 仅管理员可见 (需密码)
            </label>
        </div>`;
    }

    // IP 记录逻辑
    function logAccess(name) {
        const log = { name, ip: currentIP, time: new Date().toLocaleString() };
        accessLogs.unshift(log);
        if(accessLogs.length > 50) accessLogs.pop();
        localStorage.setItem('vertical_v3_logs', JSON.stringify(accessLogs));
    }

    // 权限与密码逻辑
    function triggerPwdDialog() {
        currentTask = isUnlocked ? "change" : "unlock";
        document.getElementById('pwd-title').innerText = isUnlocked ? "修改管理密码" : "解锁隐藏标签";
        document.getElementById('pwd-overlay').style.display = 'flex';
        document.getElementById('adminPwd').focus();
    }

    function handlePwdSubmit() {
        const input = document.getElementById('adminPwd').value;
        const saved = localStorage.getItem('vertical_v3_pwd') || "K888";

        if (currentTask === "unlock") {
            if (input === saved) {
                isUnlocked = true;
                document.body.classList.add('unlocked');
                document.getElementById('unlocked-zone').style.display = 'block';
                document.getElementById('panel-title').innerText = "管理中心 (已提权)";
                closePwd();
                render();
            } else { alert("密码错误"); }
        } else {
            if (input) {
                localStorage.setItem('vertical_v3_pwd', input);
                alert("密码修改成功");
                closePwd();
            }
        }
    }

    // 手动退出特权（测试用）
    function lockPrivilege() {
        isUnlocked = false;
        document.body.classList.remove('unlocked');
        document.getElementById('unlocked-zone').style.display = 'none';
        document.getElementById('panel-title').innerText = "管理中心";
        render(); // 重新渲染，此时 isAdmin 链接会被剔除
    }

    // 侧边栏及基础操作
    function toggleAdmin(s) { isAdminMode = s; document.body.classList.toggle('admin-open', s); render(); }
    function closePwd() { document.getElementById('pwd-overlay').style.display = 'none'; document.getElementById('adminPwd').value = ''; }
    function saveAll() { localStorage.setItem('vertical_v3_data', JSON.stringify(bloggers)); }

    function addNewLinkLine(idx) {
        const group = document.querySelectorAll('.link-group')[idx];
        const div = document.createElement('div');
        div.className = 'edit-unit';
        div.innerHTML = `<span style="position:absolute; right:10px; top:5px; cursor:pointer; color:#ccc" onclick="this.parentElement.remove()">×</span>
            <input type="text" class="tag-name-input" placeholder="名称">
            <input type="text" class="url-input" placeholder="网址">
            <label class="privilege-label"><input type="checkbox"> 仅管理员可见 (需密码)</label>`;
        group.appendChild(div);
    }

    function saveCard(idx) {
        const card = document.querySelectorAll('.blogger-card')[idx];
        const name = card.querySelector('.blogger-name-input').value;
        const units = card.querySelectorAll('.edit-unit');
        let links = [];
        units.forEach(u => {
            const label = u.querySelector('.tag-name-input').value;
            const url = u.querySelector('.url-input').value;
            const isAdmin = u.querySelector('input[type="checkbox"]').checked;
            if(url) links.push({ label, url, isAdmin });
        });
        bloggers[idx] = { name, links };
        saveAll();
        render();
    }

    function addBlogger() {
        const name = document.getElementById('newName').value;
        const urls = document.getElementById('newUrls').value.split('\n').filter(u => u.trim());
        if(!name) return;
        bloggers.push({ name, links: urls.map(u => ({ label: "新链接", url: u, isAdmin: false })) });
        saveAll(); render();
        document.getElementById('newName').value = ''; document.getElementById('newUrls').value = '';
    }

    function deleteCard(i) { if(confirm("确定删除整个卡片？")) { bloggers.splice(i,1); saveAll(); render(); } }
    function updateCardName(i, val) { bloggers[i].name = val; saveAll(); }
    function toggleLogs() {
        const area = document.getElementById('log-area');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        area.innerHTML = accessLogs.map(l => `<div>[${l.time}] ${l.ip} -> ${l.name}</div>`).join('') || "暂无记录";
    }

    window.onload = render;
</script>
</body>
</html>
