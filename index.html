<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚合导航 - 严格隔离版</title>
    <style>
        :root { --primary-color: #007bff; --danger-color: #ff4d4f; --success-color: #28a745; --bg-gray: #f4f7f9; }
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg-gray); min-height: 100vh; display: flex; }
        
        #content-wrapper { flex: 1; padding: 40px; transition: margin-right 0.3s ease; }
        body.admin-open #content-wrapper { margin-right: 340px; }
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, 340px); gap: 25px; justify-content: center; }
        
        .blogger-card { width: 340px; background: #fff; border-radius: 16px; border: 1px solid #eee; padding: 20px; position: relative; box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .edit-mode-active { border: 2px solid var(--primary-color); background: #fafafa; }
        .name-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .blogger-name-input { border: none; font-size: 18px; font-weight: bold; outline: none; background: transparent; width: 100%; }
        
        .link-group { display: flex; flex-direction: column; gap: 10px; }
        .link-item-vertical { display: flex; flex-direction: column; padding: 10px 15px; background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .link-item-vertical:hover { border-color: var(--primary-color); }
        .link-label-text { font-size: 13px; font-weight: bold; color: #333; }
        .link-url-text { font-size: 11px; color: #999; }
        
        /* 隐藏标记 */
        .admin-tag-badge { font-size: 10px; background: #fff1f0; color: #ff4d4f; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffa39e; margin-left: 5px; }

        /* 编辑控件 */
        .edit-unit { position: relative; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .tag-name-input { border: none; font-weight: bold; width: 80%; outline: none; font-size: 13px; border-bottom: 1px dashed #eee; }
        .url-input { border: none; width: 100%; font-size: 11px; color: #888; outline: none; margin-top: 5px; }
        .privilege-label { font-size: 11px; color: #666; margin-top: 8px; display: flex; align-items: center; cursor: pointer; }

        #side-admin-panel { position: fixed; top: 0; right: -340px; width: 340px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        body.admin-open #side-admin-panel { right: 0; }
        .btn-trigger { position: fixed; bottom: 30px; right: 30px; background: #333; color: white; border: none; padding: 12px 20px; border-radius: 30px; cursor: pointer; z-index: 999; }
        
        .input-style { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        #pwd-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        #pwd-box { background: #fff; padding: 30px; border-radius: 16px; width: 300px; text-align: center; }

        #log-area { display: none; margin-top: 15px; background: #f5f5f5; padding: 10px; border-radius: 8px; font-size: 11px; max-height: 150px; overflow-y: auto; text-align: left; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="content-wrapper">
        <div id="main-grid"></div>
    </div>

    <div id="side-admin-panel">
        <h2 id="panel-title" style="margin-top:0; cursor: pointer;" onclick="askPassword()">管理中心</h2>
        
        <div id="unlocked-zone" style="display: none; padding: 10px; background: #f0faff; border-radius: 10px; margin-bottom: 20px;">
            <p style="font-size:12px; color:#007bff; margin:0 0 10px 0;">已解锁：隐藏内容可用</p>
            <button class="btn-action" style="background:#555; color:white; font-size:11px;" onclick="toggleLogs()">查看访问记录</button>
            <div id="log-area"></div>
            <button class="btn-action" style="background:var(--danger-color); color:white; font-size:11px; margin-top:10px;" onclick="exitPrivilege()">🔒 退出特权模式 (立即隐藏标签)</button>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin:15px 0">
        
        <div style="font-size:13px; color:#666; margin-bottom:8px;">创建卡片</div>
        <input type="text" id="newName" class="input-style" placeholder="卡片标题">
        <textarea id="newUrls" class="input-style" placeholder="批量地址 (一行一个)" style="height:80px; resize:none;"></textarea>
        <button class="btn-action" style="background:var(--primary-color); color:white;" onclick="addBlogger()">创建</button>
        <button class="btn-action" style="background:#eee; color:#333;" onclick="toggleAdmin(false)">收起侧边栏</button>
    </div>

    <div id="pwd-overlay">
        <div id="pwd-box">
            <h3 id="pwd-title">身份核验</h3>
            <input type="password" id="adminPwd" class="input-style" placeholder="输入密码">
            <div style="display:flex; gap:10px">
                <button class="btn-action" style="background:var(--primary-color); color:white" onclick="submitPwd()">确定</button>
                <button class="btn-action" style="background:#eee" onclick="closePwd()">取消</button>
            </div>
        </div>
    </div>

    <button class="btn-trigger" onclick="toggleAdmin(true)">⚙️ 开启管理模式</button>

<script>
    // 1. 初始化变量 (isUnlocked 严禁存入 localStorage，确保刷新必锁定)
    let bloggers = JSON.parse(localStorage.getItem('v4_data')) || [];
    let accessLogs = JSON.parse(localStorage.getItem('v4_logs')) || [];
    let isAdminMode = false;
    let isUnlocked = false; 
    let currentIP = "0.0.0.0";
    let task = "unlock";

    fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => currentIP = d.ip);

    // 2. 严格渲染函数
    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = bloggers.map((b, i) => {
            // 【权限隔离核心】：如果 isUnlocked 为 false，所有 isAdmin 标记的链接强制不生成 HTML
            const displayLinks = isUnlocked ? b.links : b.links.filter(l => l.isAdmin !== true);
            
            return `
            <div class="blogger-card ${isAdminMode ? 'edit-mode-active' : ''}">
                <div class="name-row">
                    <input type="text" class="blogger-name-input" value="${b.name}" ${!isAdminMode ? 'readonly' : ''} onchange="updateBloggerName(${i}, this.value)">
                </div>
                <div class="link-group">
                    ${displayLinks.map((link, j) => renderLink(link, i, j)).join('')}
                </div>
                ${isAdminMode ? `
                    <button class="add-item-btn" onclick="addLinkInput(${i})">+ 增加</button>
                    <div style="margin-top:15px; display:flex; gap:5px">
                        <button class="btn-action" style="background:var(--success-color); color:white; font-size:12px; flex:1" onclick="saveCard(${i})">保存</button>
                        <button class="btn-action" style="background:#ddd; font-size:12px; flex:1" onclick="deleteCard(${i})">删除卡片</button>
                    </div>
                ` : ''}
            </div>`;
        }).join('');
    }

    function renderLink(link, cardI, linkI) {
        if (!isAdminMode) {
            return `
            <a href="${link.url}" target="_blank" class="link-item-vertical" onclick="recordClick('${link.label}')">
                <span class="link-label-text">${link.label} ${link.isAdmin ? '<span class="admin-tag-badge">密</span>' : ''}</span>
                <span class="link-url-text">${link.url}</span>
            </a>`;
        }
        return `
        <div class="edit-unit">
            <span style="position:absolute; right:10px; top:5px; cursor:pointer; color:#ccc" onclick="this.parentElement.remove()">×</span>
            <input type="text" class="tag-name-input" value="${link.label}">
            <input type="text" class="url-input" value="${link.url}">
            <label class="privilege-label">
                <input type="checkbox" ${link.isAdmin ? 'checked' : ''}> 仅管理员可见
            </label>
        </div>`;
    }

    // 3. 退出特权逻辑 (这是你需要的测试功能)
    function exitPrivilege() {
        isUnlocked = false; // 物理重置状态
        document.getElementById('unlocked-zone').style.display = 'none';
        document.getElementById('panel-title').innerText = "管理中心";
        render(); // 立即重新渲染，剔除隐藏标签
        alert("已成功退出特权模式，隐藏内容已锁定。");
    }

    // 4. 身份验证逻辑
    function askPassword() {
        task = isUnlocked ? "change" : "unlock";
        document.getElementById('pwd-title').innerText = isUnlocked ? "修改新密码" : "验证隐藏内容";
        document.getElementById('pwd-overlay').style.display = 'flex';
    }

    function submitPwd() {
        const input = document.getElementById('adminPwd').value;
        const saved = localStorage.getItem('v4_pwd') || "K888";

        if (task === "unlock") {
            if (input === saved) {
                isUnlocked = true;
                document.getElementById('unlocked-zone').style.display = 'block';
                document.getElementById('panel-title').innerText = "管理中心 (已解锁)";
                closePwd();
                render();
            } else { alert("密码错误"); }
        } else {
            if (input) {
                localStorage.setItem('v4_pwd', input);
                alert("新密码已生效");
                closePwd();
            }
        }
    }

    // 5. 辅助功能
    function recordClick(name) {
        accessLogs.unshift({ name, ip: currentIP, time: new Date().toLocaleString() });
        if(accessLogs.length > 50) accessLogs.pop();
        localStorage.setItem('v4_logs', JSON.stringify(accessLogs));
    }
    function toggleAdmin(s) { isAdminMode = s; document.body.classList.toggle('admin-open', s); render(); }
    function closePwd() { document.getElementById('pwd-overlay').style.display = 'none'; document.getElementById('adminPwd').value = ''; }
    function persist() { localStorage.setItem('v4_data', JSON.stringify(bloggers)); }
    function addLinkInput(idx) {
        const group = document.querySelectorAll('.link-group')[idx];
        const div = document.createElement('div');
        div.className = 'edit-unit';
        div.innerHTML = `<span style="position:absolute; right:10px; top:5px; cursor:pointer; color:#ccc" onclick="this.parentElement.remove()">×</span>
            <input type="text" class="tag-name-input" placeholder="标签名"><input type="text" class="url-input" placeholder="URL">
            <label class="privilege-label"><input type="checkbox"> 仅管理员可见</label>`;
        group.appendChild(div);
    }
    function saveCard(idx) {
        const card = document.querySelectorAll('.blogger-card')[idx];
        const name = card.querySelector('.blogger-name-input').value;
        const units = card.querySelectorAll('.edit-unit');
        let links = [];
        units.forEach(u => {
            const label = u.querySelector('.tag-name-input').value;
            const url = u.querySelector('.url-input').value;
            const isAdmin = u.querySelector('input[type="checkbox"]').checked;
            if(url) links.push({ label, url, isAdmin });
        });
        bloggers[idx] = { name, links };
        persist(); render();
    }
    function addBlogger() {
        const name = document.getElementById('newName').value;
        if(!name) return;
        bloggers.push({ name, links: [] });
        persist(); render();
        document.getElementById('newName').value = '';
    }
    function deleteCard(i) { if(confirm("删除卡片？")) { bloggers.splice(i,1); persist(); render(); } }
    function updateBloggerName(i, v) { bloggers[i].name = v; persist(); }
    function toggleLogs() {
        const area = document.getElementById('log-area');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        area.innerHTML = accessLogs.map(l => `<div>[${l.time}] ${l.ip} -> ${l.name}</div>`).join('') || "无记录";
    }

    window.onload = render;
</script>
</body>
</html>
