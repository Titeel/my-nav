<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚合导航 - 强力兼容版</title>
    <style>
        :root { --primary-color: #007bff; --danger-color: #ff4d4f; --success-color: #28a745; --bg-gray: #f4f7f9; }
        body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg-gray); display: flex; }
        #content-wrapper { flex: 1; padding: 40px; transition: margin-right 0.3s ease; }
        body.admin-open #content-wrapper { margin-right: 340px; }
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 20px; justify-content: center; }
        .blogger-card { width: 320px; background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 15px; border: 1px solid #eee; height: fit-content; }
        .name-row { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .link-item { display: block; padding: 8px 12px; margin: 5px 0; background: #f8f9fa; border-radius: 6px; text-decoration: none; color: #333; font-size: 14px; border: 1px solid transparent; }
        .link-item:hover { border-color: var(--primary-color); background: #fff; }
        #side-admin-panel { position: fixed; top: 0; right: -340px; width: 340px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; visibility: hidden; }
        body.admin-open #side-admin-panel { right: 0; visibility: visible; }
        .input-style { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #float-tools { position: fixed; bottom: 20px; right: 20px; }
        .btn-trigger { background: #333; color: #fff; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body class="admin-open">

    <div id="content-wrapper">
        <div id="main-grid"></div>
    </div>

    <div id="side-admin-panel">
        <h3>⚙️ 管理中心</h3>
        <div style="background:#fff4f4; padding:10px; border-radius:8px; margin-bottom:15px; font-size:12px; border:1px solid #ffecec;">
            <strong>1. 配置云端</strong>
            <input type="password" id="gh_token" class="input-style" placeholder="GitHub Token">
            <input type="text" id="gh_gistid" class="input-style" placeholder="Gist ID">
            <button class="btn-action" style="background:#333; color:white;" onclick="initConnect()">连接并拉取</button>
            <div id="log" style="color:green; margin-top:5px; font-weight:bold;"></div>
        </div>
        
        <hr>
        <strong>2. 创建卡片分类</strong>
        <input type="text" id="newName" class="input-style" placeholder="卡片标题 (如: 常用工具)">
        <textarea id="newUrls" class="input-style" style="height:80px;" placeholder="网址 (每行一个)"></textarea>
        <button class="btn-action" style="background:var(--primary-color); color:white;" onclick="addCard()">确认创建并同步</button>
        <button class="btn-action" style="background:#eee; color:#666;" onclick="toggleAdmin(false)">收起面板</button>
    </div>

    <div id="float-tools">
        <button class="btn-trigger" onclick="toggleAdmin(true)">⚙️ 管理面板</button>
    </div>

<script>
    const FILE_NAME = "nav_cloud_db.json";[cite: 1]
    let bloggers = [];

    // 初始化加载
    window.onload = () => {
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh_gistid').value = localStorage.getItem('gh_gistid') || '';
        if(localStorage.getItem('gh_token') && localStorage.getItem('gh_gistid')) initConnect();
    };

    async function initConnect() {
        const tk = document.getElementById('gh_token').value.trim();
        const gid = document.getElementById('gh_gistid').value.trim();
        const logEl = document.getElementById('log');
        
        if(!tk || !gid) return;
        localStorage.setItem('gh_token', tk);
        localStorage.setItem('gh_gistid', gid);

        logEl.innerText = "⏳ 连接中...";
        try {
            const res = await fetch(`https://api.github.com/gists/${gid}`, {
                headers: { 'Authorization': `token ${tk}` }
            });
            if(res.ok) {
                const data = await res.json();
                const content = data.files[FILE_NAME]?.content || "[]";[cite: 1]
                let parsed = JSON.parse(content);
                
                // --- 强力兼容逻辑：确保格式为 [ {name, links:[]} ] ---
                if (Array.isArray(parsed) && parsed.length > 0 && !parsed[0].links) {
                    bloggers = [{ name: "未分类导入", links: parsed }];
                } else {
                    bloggers = Array.isArray(parsed) ? parsed : [];
                }
                
                render();
                logEl.innerText = "✅ 连接成功";
            } else { logEl.innerText = "❌ ID或Token错误"; }
        } catch(e) { logEl.innerText = "❌ 网络请求失败"; }
    }

    async function sync() {
        const tk = localStorage.getItem('gh_token');
        const gid = localStorage.getItem('gh_gistid');
        try {
            await fetch(`https://api.github.com/gists/${gid}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${tk}` },
                body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(bloggers) } } })[cite: 1]
            });
            render();
        } catch(e) { alert("同步失败"); }
    }

    function addCard() {
        const name = document.getElementById('newName').value.trim();
        const urls = document.getElementById('newUrls').value.trim().split('\n');
        if(!name) return alert("标题不能为空");
        
        let links = urls.filter(u => u.trim()).map(u => {
            let fullUrl = u.trim();
            if(!/^https?:\/\//i.test(fullUrl)) fullUrl = 'https://' + fullUrl;
            return { label: "快捷访问", url: fullUrl };
        });

        bloggers.push({ name, links });
        sync();
        document.getElementById('newName').value = '';
        document.getElementById('newUrls').value = '';
    }

    function removeCard(i) {
        if(confirm("确定删除此卡片？")) {
            bloggers.splice(i, 1);
            sync();
        }
    }

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = bloggers.map((b, i) => `
            <div class="blogger-card">
                <div class="name-row">
                    ${b.name} 
                    <span style="color:red; font-size:12px; cursor:pointer; float:right" onclick="removeCard(${i})">删除</span>
                </div>
                <div>
                    ${b.links.map(l => `<a href="${l.url}" target="_blank" class="link-item">${l.url.replace('https://','')}</a>`).join('')}
                </div>
            </div>
        `).join('');
    }

    function toggleAdmin(show) {
        document.body.classList.toggle('admin-open', show);
    }
</script>
</body>
</html>
