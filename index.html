<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>精简书签同步版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .link { display: block; margin: 5px 0; color: #007bff; text-decoration: none; }
        .config-bar { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        input { padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
        #log { color: #d93025; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="config-bar">
    <input type="password" id="token" placeholder="GitHub Token">
    <input type="text" id="gistId" placeholder="Gist ID">
    <button onclick="saveConfig()">1. 保存并连接</button>
    <div id="log">状态：等待配置...</div>
</div>

<div id="app">
    <div class="card">
        <h3>添加测试链接</h3>
        <input type="text" id="siteName" placeholder="站点名">
        <input type="text" id="siteUrl" placeholder="网址 (如 baidu.com)">
        <button onclick="addItem()">2. 添加并同步</button>
    </div>
    <div id="list"></div>
</div>

<script>
    let db = [];
    const FILE_NAME = "nav_cloud_db.json";[cite: 1]

    // 解决“前缀”问题的关键函数
    function cleanUrl(url) {
        url = url.trim();
        if (!/^https?:\/\//i.test(url)) return 'https://' + url;
        return url;
    }

    // 保存配置并尝试拉取
    function saveConfig() {
        localStorage.setItem('gh_token', document.getElementById('token').value);
        localStorage.setItem('gh_gist', document.getElementById('gistId').value);
        pull();
    }

    // 从云端拉取
    async function pull() {
        const tk = localStorage.getItem('gh_token');
        const gid = localStorage.getItem('gh_gist');
        const log = document.getElementById('log');
        
        if(!tk || !gid) return;

        try {
            const res = await fetch(`https://api.github.com/gists/${gid}`, {
                headers: { 'Authorization': `token ${tk}` }
            });
            if(res.ok) {
                const data = await res.json();
                const content = data.files[FILE_NAME].content;[cite: 1]
                db = JSON.parse(content || "[]");
                render();
                log.innerText = "状态：云端连接成功 ✅";
                log.style.color = "green";
            } else {
                log.innerText = "状态：连接失败 (请检查Token和ID)";
            }
        } catch(e) { log.innerText = "状态：网络错误"; }
    }

    // 同步到云端
    async function push() {
        const tk = localStorage.getItem('gh_token');
        const gid = localStorage.getItem('gh_gist');
        const log = document.getElementById('log');

        try {
            const res = await fetch(`https://api.github.com/gists/${gid}`, {
                method: 'PATCH',
                headers: { 'Authorization': `token ${tk}` },
                body: JSON.stringify({
                    files: { [FILE_NAME]: { content: JSON.stringify(db) } }[cite: 1]
                })
            });
            if(res.ok) {
                log.innerText = "状态：同步成功 ✅";
                render();
            } else {
                const err = await res.json();
                alert("同步失败：" + err.message);
            }
        } catch(e) { alert("网络异常"); }
    }

    function addItem() {
        const name = document.getElementById('siteName').value;
        const url = document.getElementById('siteUrl').value;
        if(!name || !url) return alert("请填满信息");
        
        db.push({ name, url: cleanUrl(url) }); // 自动清洗 URL
        push();
    }

    function render() {
        document.getElementById('list').innerHTML = db.map(item => `
            <div class="card">
                <strong>${item.name}</strong>
                <a class="link" href="${item.url}" target="_blank">${item.url}</a>
            </div>
        `).join('');
    }

    // 页面加载时自动填入
    window.onload = () => {
        document.getElementById('token').value = localStorage.getItem('gh_token') || "";
        document.getElementById('gistId').value = localStorage.getItem('gh_gist') || "";
        pull();
    };
</script>
</body>
</html>
