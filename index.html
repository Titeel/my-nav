<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聚合导航 - 调试修复版</title>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f9; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); display: flex; }
        #content-wrapper { flex: 1; padding: 20px; transition: margin-right 0.3s; }
        body.admin-open #content-wrapper { margin-right: 340px; }
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, 300px); gap: 20px; justify-content: center; }
        .card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-title { font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .link { display: block; padding: 6px; color: #444; text-decoration: none; font-size: 13px; background: #f9f9f9; margin: 4px 0; border-radius: 4px; }
        #side-panel { position: fixed; top: 0; right: -340px; width: 340px; height: 100%; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 999; padding: 20px; box-sizing: border-box; overflow-y: auto; visibility: hidden; }
        body.admin-open #side-panel { right: 0; visibility: visible; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-dark { background: #333; color: white; }
    </style>
</head>
<body class="admin-open">

    <div id="content-wrapper">
        <div id="main-grid"></div>
    </div>

    <div id="side-panel">
        <h3>⚙️ 管理中心</h3>
        <p style="font-size: 12px; color: #666;">如果点击没反应，请确认 Gist ID 是否正确</p>
        
        <input type="password" id="gh_token" placeholder="GitHub Token">
        <input type="text" id="gh_gistid" placeholder="Gist ID">
        <button class="btn-dark" onclick="forceConnect()">1. 连接并拉取数据</button>
        <div id="status" style="font-size:12px; margin-top:5px;"></div>
        
        <hr>
        <input type="text" id="newName" placeholder="新分类名称">
        <textarea id="newUrls" placeholder="网址列表 (每行一个)"></textarea>
        <button class="btn-main" onclick="addNewCard()">2. 确认创建并同步</button>
        
        <button style="background:#eee; margin-top:30px;" onclick="toggleUI(false)">收起管理界面</button>
    </div>

    <button style="position:fixed; bottom:20px; right:20px; padding:10px 20px; border-radius:20px; background:#333; color:white; border:none; cursor:pointer;" onclick="toggleUI(true)">⚙️ 打开管理</button>

<script>
    // 强制全局防错
    window.onerror = function(msg) {
        document.getElementById('status').innerHTML = '<span style="color:red">脚本错误: ' + msg + '</span>';
    };

    const FILE_NAME = "nav_cloud_db.json";[cite: 1]
    let bloggers = [];

    // 初始化：仅填入输入框，不自动执行可能导致报错的连接
    window.onload = function() {
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh_gistid').value = localStorage.getItem('gh_gistid') || '';
    };

    function toggleUI(show) {
        if(show) document.body.classList.add('admin-open');
        else document.body.classList.remove('admin-open');
    }

    async function forceConnect() {
        const tk = document.getElementById('gh_token').value.trim();
        const gid = document.getElementById('gh_gistid').value.trim();
        const st = document.getElementById('status');

        if(!tk || !gid) return alert("请完整填写 Token 和 ID");
        localStorage.setItem('gh_token', tk);
        localStorage.setItem('gh_gistid', gid);

        st.innerText = "正在联网...";
        try {
            const res = await fetch('https://api.github.com/gists/' + gid, {
                headers: { 'Authorization': 'token ' + tk }
            });
            if(res.ok) {
                const data = await res.json();
                const content = data.files[FILE_NAME] ? data.files[FILE_NAME].content : "[]";[cite: 1]
                
                try {
                    bloggers = JSON.parse(content);
                    if(!Array.isArray(bloggers)) bloggers = []; 
                } catch(e) {
                    st.innerText = "注意：云端数据损坏，已初始化。";
                    bloggers = [];
                }
                
                render();
                st.innerHTML = '<span style="color:green">✅ 连接成功</span>';
            } else {
                st.innerHTML = '<span style="color:red">❌ 错误: ' + res.status + '</span>';
            }
        } catch(e) {
            st.innerHTML = '<span style="color:red">❌ 网络异常</span>';
        }
    }

    async function addNewCard() {
        const name = document.getElementById('newName').value.trim();
        const urls = document.getElementById('newUrls').value.trim().split('\n');
        const tk = localStorage.getItem('gh_token');
        const gid = localStorage.getItem('gh_gistid');

        if(!name || !tk) return alert("配置未完成或标题为空");

        const newLinks = urls.filter(u => u.trim()).map(u => {
            let addr = u.trim();
            if(!addr.startsWith('http')) addr = 'https://' + addr;
            return { url: addr };
        });

        bloggers.push({ name: name, links: newLinks });

        try {
            const res = await fetch('https://api.github.com/gists/' + gid, {
                method: 'PATCH',
                headers: { 'Authorization': 'token ' + tk },
                body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(bloggers) } } })[cite: 1]
            });
            if(res.ok) {
                render();
                alert("同步成功！");
            }
        } catch(e) { alert("同步失败"); }
    }

    function deleteCard(i) {
        if(confirm("确定删除？")) {
            bloggers.splice(i, 1);
            const tk = localStorage.getItem('gh_token');
            const gid = localStorage.getItem('gh_gistid');
            fetch('https://api.github.com/gists/' + gid, {
                method: 'PATCH',
                headers: { 'Authorization': 'token ' + tk },
                body: JSON.stringify({ files: { [FILE_NAME]: { content: JSON.stringify(bloggers) } } })[cite: 1]
            }).then(() => render());
        }
    }

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = bloggers.map((b, i) => `
            <div class="card">
                <div class="card-title">
                    ${b.name} 
                    <button onclick="deleteCard(${i})" style="width:auto; margin:0; padding:2px 5px; font-size:10px; background:#ff4d4f; color:white;">删除</button>
                </div>
                ${(b.links || []).map(l => `<a href="${l.url}" target="_blank" class="link">${l.url}</a>`).join('')}
            </div>
        `).join('');
    }
</script>
</body>
</html>
